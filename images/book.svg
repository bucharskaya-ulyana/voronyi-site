<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="600" height="450" fill="#2e3a6b"/>
<circle cx="80" cy="70" r="140" fill="#8fb3e0" opacity="0.25"/>
<circle cx="540" cy="400" r="160" fill="#d98a9b" opacity="0.25"/>
<path d="M40,80 Q170,55 300,85 L300,400 Q170,370 40,395 Z" fill="#fbf6ec"/>
<path d="M560,80 Q430,55 300,85 L300,400 Q430,370 560,395 Z" fill="#f6efe1"/>
<path d="M300,85 L300,400" stroke="#d9cdb6" stroke-width="2"/>
<text x="170" y="140" font-family="Georgia,serif" font-size="30" fill="#2e3a6b" text-anchor="middle" font-weight="bold">Микола</text>
<text x="170" y="178" font-family="Georgia,serif" font-size="30" fill="#2e3a6b" text-anchor="middle" font-weight="bold">Вороний</text>
<line x1="110" y1="200" x2="230" y2="200" stroke="#c9a24a" stroke-width="2"/>
<text x="170" y="240" font-family="Georgia,serif" font-size="22" fill="#6b6170" text-anchor="middle" font-style="italic">У сяйві мрій</text>
<text x="170" y="270" font-family="Georgia,serif" font-size="15" fill="#6b6170" text-anchor="middle">поезії</text>
<text x="430" y="125" font-family="Georgia,serif" font-size="24" fill="#2e3a6b" text-anchor="middle" font-weight="bold">Краса!</text>
<text x="330" y="175" font-family="Georgia,serif" font-size="17" fill="#2b2530" font-style="italic">Її я славлю, і хвалю,</text>
<text x="330" y="209" font-family="Georgia,serif" font-size="17" fill="#2b2530" font-style="italic">І кожну їй хвилину</text>
<text x="330" y="243" font-family="Georgia,serif" font-size="17" fill="#2b2530" font-style="italic">Готов оддати без жалю.</text>
<text x="330" y="277" font-family="Georgia,serif" font-size="17" fill="#2b2530" font-style="italic">Мій друже, я Красу люблю…</text>
<text x="330" y="311" font-family="Georgia,serif" font-size="17" fill="#2b2530" font-style="italic">Як рідну Україну!</text>
</svg>